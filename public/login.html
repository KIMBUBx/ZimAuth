<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZimAuth — Login & Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center space-x-3 mb-4">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
        </div>
        <span class="text-3xl font-black tracking-tight text-white">Zim<span class="gradient-text">Auth</span></span>
      </a>
      <p class="text-slate-400 text-sm">Sign in to your unrestricted developer panel</p>
    </div>

    <!-- Auth Card -->
    <div class="glass-card p-8 border-indigo-500/20 shadow-2xl">
      <!-- Tabs -->
      <div class="flex border-b border-slate-700/60 mb-6">
        <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 pb-3 text-sm font-bold text-indigo-400 border-b-2 border-indigo-500 transition">
          Sign In
        </button>
        <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 pb-3 text-sm font-semibold text-slate-400 hover:text-slate-200 transition">
          Create Account
        </button>
      </div>

      <!-- Free Plan Badge -->
      <div class="mb-6 p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-xs text-indigo-300 flex items-center space-x-2">
        <i data-lucide="sparkles" class="w-4 h-4 text-indigo-400 flex-shrink-0"></i>
        <span>Every account automatically receives <strong>Unlimited Enterprise Free Tier</strong>.</span>
      </div>

      <!-- Error / Success Alert -->
      <div id="alert-box" class="hidden mb-6 p-3 rounded-xl text-xs font-medium"></div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="space-y-4 mb-6">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Username or Email</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                <i data-lucide="user" class="w-4 h-4"></i>
              </span>
              <input type="text" id="login-username" required value="admin"
                class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input type="password" id="login-password" required value="admin123"
                class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="w-full gradient-btn font-bold py-3 rounded-xl text-sm shadow-lg flex items-center justify-center space-x-2">
          <span>Sign In to Dashboard</span>
          <i data-lucide="log-in" class="w-4 h-4"></i>
        </button>

        <div class="mt-4 text-center text-xs text-slate-500">
          Default admin credentials: <code class="text-indigo-400">admin / admin123</code>
        </div>
      </form>

      <!-- Register Form -->
      <form id="register-form" onsubmit="handleRegister(event)" class="hidden">
        <div class="space-y-4 mb-6">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Username</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                <i data-lucide="user" class="w-4 h-4"></i>
              </span>
              <input type="text" id="reg-username" required placeholder="developer_zim"
                class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Email Address</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </span>
              <input type="email" id="reg-email" required placeholder="dev@zimauth.cc"
                class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </span>
              <input type="password" id="reg-password" required placeholder="••••••••••••"
                class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="w-full gradient-btn font-bold py-3 rounded-xl text-sm shadow-lg flex items-center justify-center space-x-2">
          <span>Create Free Account</span>
          <i data-lucide="user-plus" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

    <!-- Back to site -->
    <div class="text-center mt-6">
      <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition flex items-center justify-center space-x-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Return to Homepage</span>
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function switchTab(tab) {
      const loginBtn = document.getElementById('tab-login-btn');
      const regBtn = document.getElementById('tab-register-btn');
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const alertBox = document.getElementById('alert-box');
      alertBox.classList.add('hidden');

      if (tab === 'login') {
        loginBtn.className = 'flex-1 pb-3 text-sm font-bold text-indigo-400 border-b-2 border-indigo-500 transition';
        regBtn.className = 'flex-1 pb-3 text-sm font-semibold text-slate-400 hover:text-slate-200 transition';
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
      } else {
        regBtn.className = 'flex-1 pb-3 text-sm font-bold text-indigo-400 border-b-2 border-indigo-500 transition';
        loginBtn.className = 'flex-1 pb-3 text-sm font-semibold text-slate-400 hover:text-slate-200 transition';
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alert-box');
      box.textContent = msg;
      box.className = `mb-6 p-3 rounded-xl text-xs font-medium ${
        isSuccess ? 'bg-emerald-500/15 border border-emerald-500/30 text-emerald-300' : 'bg-rose-500/15 border border-rose-500/30 text-rose-300'
      }`;
      box.classList.remove('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/dashboard/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          showAlert('Login successful! Redirecting...', true);
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } else {
          showAlert(data.message || 'Login failed.');
        }
      } catch (err) {
        showAlert('Network error: ' + err.message);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const res = await fetch('/api/dashboard/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (data.success) {
          showAlert('Account created with Enterprise Lifetime Plan! Redirecting...', true);
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } else {
          showAlert(data.message || 'Registration failed.');
        }
      } catch (err) {
        showAlert('Network error: ' + err.message);
      }
    }
  </script>
</body>
</html>
